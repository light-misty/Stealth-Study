# Desktop release builds — Windows only (.msi + NSIS .exe).
#
# CI calls the SAME scripts developers run locally (packaging/build_windows.ps1);
# this file only provisions the toolchain (Node, Rust, a Python venv at
# .venv with PyInstaller) and publishes the results.
#
# Triggers:
#   - tag push `v*`  → builds Windows target and attaches it to a DRAFT GitHub Release
#                      (review, then publish by hand).
#   - manual run     → builds and uploads workflow artifacts only (no release).
#
# 仅支持 Windows 平台；macOS 构建已禁用（代码保留在 build_dmg.sh 中，不运行）。
#
# Each installer is uploaded twice: once with its versioned name (archive) and once with a
# stable name (OpenWorker-windows-setup.exe, OpenWorker-windows.msi) so the website can link to
#   github.com/<repo>/releases/latest/download/<stable-name>
# and never need updating.
#
# Windows remains UNSIGNED (Authenticode is a later step).

name: Release

on:
  push:
    tags: ["v*", "app-v*"]
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 构建已禁用 —— 保留代码在 packaging/build_dmg.sh 中，不运行 CI
          # - os: macos-latest
          #   slug: macos-arm64
          # - os: macos-15-intel
          #   slug: macos-x64
          - os: windows-latest
            slug: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: surfaces/gui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: surfaces/gui/src-tauri

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up the sidecar venv (.venv)
        run: |
          python -m venv .venv
          $VPY = ".venv\Scripts\python.exe"
          & $VPY -m pip install --upgrade pip
          & $VPY -m pip install -e ".[bedrock]" pyinstaller typer tzdata
          & $VPY -c "import aisuite, ss"

      - name: npm ci
        working-directory: surfaces/gui
        run: npm ci

      - name: Build .msi + NSIS .exe (Windows)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ./packaging/build_windows.ps1

      - name: Stage artifacts (versioned + stable names)
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $BUNDLE = "surfaces\gui\src-tauri\target\release\bundle"
          Copy-Item "$BUNDLE\nsis\*.exe" out\
          Copy-Item "$BUNDLE\nsis\*.exe" out\OpenWorker-windows-setup.exe
          Copy-Item "$BUNDLE\msi\*.msi" out\
          Copy-Item "$BUNDLE\msi\*.msi" out\OpenWorker-windows.msi
          $SIG = Get-Item "$BUNDLE\nsis\*.exe.sig" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($SIG) { Copy-Item $SIG.FullName out\OpenWorker-windows-setup.exe.sig }
          Get-ChildItem out | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}
          path: out/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compose the auto-update manifest (latest.json)
        shell: bash -l {0}
        run: |
          TAG="${GITHUB_REF_NAME}"
          CONF_VERSION=$(python3 -c "import json; print(json.load(open('surfaces/gui/src-tauri/tauri.conf.json'))['version'])")
          if [ "${TAG#v}" != "$CONF_VERSION" ]; then
            echo "::error::tag $TAG != tauri.conf.json version $CONF_VERSION — bump the config before tagging"
            exit 1
          fi
          if ls dist/*.sig >/dev/null 2>&1; then
            python3 packaging/make_update_manifest.py \
              --version "${TAG#v}" --tag "$TAG" --repo "$GITHUB_REPOSITORY" \
              --dist dist --out dist/latest.json \
              --notes "Stealth Study ${TAG#v}"
          else
            echo "::warning::no updater signatures in dist/ — release ships WITHOUT auto-update manifest"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          generate_release_notes: true
