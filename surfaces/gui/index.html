<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stealth Study</title>
    <!-- Resolve the theme before first paint (no white flash for dark users).
         Must match src/theme.ts: key "ss-theme", absent/invalid = auto = follow macOS. -->
    <script>
      try {
        var t = localStorage.getItem("ss-theme");
        var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
      // Same reason as the theme: <html lang> must be right before the app mounts, or
      // screen readers voice the whole Chinese UI with an English pronunciation table.
      try {
        var l = localStorage.getItem("ss.lang");
        if (!l) l = (navigator.language || "").toLowerCase().startsWith("zh") ? "zh" : "en";
        document.documentElement.lang = l;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
